      <rect x="42" y="21" width="16" height="16" rx="3.5"/>
      <rect x="63" y="21" width="16" height="16" rx="3.5"/>
      <rect x="21" y="42" width="16" height="16" rx="3.5"/>
      <rect x="63" y="42" width="16" height="16" rx="3.5"/>
      <rect x="21" y="63" width="16" height="16" rx="3.5"/>
      <rect x="42" y="63" width="16" height="16" rx="3.5"/>
      <rect x="63" y="63" width="16" height="16" rx="3.5"/>
