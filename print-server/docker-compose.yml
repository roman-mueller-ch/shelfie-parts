# Shelfie print server. Runs on the Raspberry Pi the P-touch is plugged into.
# Reachable only over Tailscale at https://labels.<tailnet>.ts.net; nothing is
# published on the Pi's network interfaces. State lives in ./data.

name: shelfie-print

services:
  ts-labels:
    image: tailscale/tailscale:latest
    hostname: labels
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY_LABELS:?set TS_AUTHKEY_LABELS in .env}
      - TS_HOSTNAME=labels
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
    volumes:
      # Mount the folder, not the file, so serve.json edits are picked up.
      - ./tailscale/labels:/config:ro
      - ./data/tailscale/labels:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  print-server:
    build: .
    image: shelfie-print-server:local
    network_mode: service:ts-labels
    depends_on:
      ts-labels:
        condition: service_healthy
    environment:
      # Tape width for previews until the printer has been seen (52 px = 9 mm tape).
      - LABEL_DEFAULT_TAPE_PX=52
    volumes:
      # The whole USB bus, so the printer is found again after unplugging or
      # switching it off and on (its device node changes each time).
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"  # USB devices
    restart: unless-stopped
